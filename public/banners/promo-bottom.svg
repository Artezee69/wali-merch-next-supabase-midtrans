<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="dim4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="800" height="400" fill="url(#bg4)"/>

  <!-- T-shirt silhouette -->
  <g transform="translate(450, 60)" opacity="0.85">
    <path d="M 80 30 L 110 0 L 180 0 L 200 30 L 240 60 L 220 110 L 195 100 L 195 320 L 95 320 L 95 100 L 70 110 L 50 60 Z"
          fill="#0b0b0b" stroke="#d7ff53" stroke-width="2.5" filter="url(#glow4)"/>
    <!-- Collar -->
    <path d="M 110 0 Q 145 30 180 0" fill="none" stroke="#d7ff53" stroke-width="2"/>
    <!-- Logo on chest -->
    <text x="145" y="75" font-family="Impact, sans-serif" font-weight="900" font-size="14" fill="#d7ff53" text-anchor="middle" letter-spacing="2">WALI</text>
    <text x="145" y="93" font-family="'Courier New', monospace" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.6">EST. 1999</text>
  </g>

  <!-- Particles -->
  <g fill="#d7ff53" opacity="0.6">
    <circle cx="100" cy="60" r="1.5"/>
    <circle cx="180" cy="100" r="1"/>
    <circle cx="60" cy="180" r="1.5"/>
    <circle cx="350" cy="50" r="1"/>
    <circle cx="400" cy="90" r="1.5"/>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(50, 100)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#d7ff53" stroke-width="3"/>
    <text x="40" y="5" font-family="'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="4" fill="#d7ff53">NEW IN / 2026</text>
  </g>

  <!-- Main text -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900">
    <text x="50" y="200" font-size="64" fill="#ffffff" letter-spacing="-1">TSHIRT</text>
    <text x="50" y="270" font-size="64" fill="#d7ff53" letter-spacing="-1" filter="url(#glow4)">PLAYER</text>
    <text x="50" y="340" font-size="36" fill="#ffffff" letter-spacing="2" opacity="0.8">EDITION</text>
  </g>

  <!-- Bottom CTA -->
  <text x="50" y="380" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#d7ff53" letter-spacing="3">▸ SHOP NOW</text>
</svg>